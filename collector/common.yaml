# Shared by every scenario: OTLP over HTTP in, JSON lines out, the
# collector's own metrics on a separate port.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:${env:OTLP_HTTP_PORT}

exporters:
  file/traces: {path: "${env:OUT_DIR}/traces.jsonl"}
  file/logs: {path: "${env:OUT_DIR}/logs.jsonl"}
  file/metrics: {path: "${env:OUT_DIR}/metrics.jsonl"}
